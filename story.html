<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Story — Survivors Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #2E1B2E;
      --ink-soft: #5A4060;
      --rose: #C4848F;
      --linen: #F8F3EE;
      --white: #FDFAF7;
      --body-font: 'Source Sans 3', sans-serif;
      --head-font: 'Lora', Georgia, serif;
    }
    body { font-family: var(--body-font); background: var(--linen); color: var(--ink); line-height: 1.8; margin: 0; padding: 2rem 1rem; }
    .container { max-width: 750px; margin: 0 auto; background: var(--white); padding: 3rem 2.5rem; border-radius: 12px; }
    .back-link { display: inline-block; margin-bottom: 2rem; color: var(--rose); font-weight: 600; text-decoration: none; }
    h1 { font-family: var(--head-font); font-size: 2.2rem; margin-bottom: 0.5rem; line-height: 1.3; }
    .meta { font-size: 0.9rem; color: var(--ink-soft); margin-bottom: 2rem; border-bottom: 1px solid #EDE6DE; padding-bottom: 1rem; }
    .content { font-size: 1.1rem; color: var(--ink); }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-link">← Back to All Stories</a>
  <h1 id="story-title">Story Title</h1>
  <div class="meta" id="story-meta">Author · Date</div>
  <div class="content" id="story-content">
    <p>Loading full story content...</p>
  </div>
</div>

<script>
  // Dynamic page loader placeholder
  const urlParams = new URLSearchParams(window.location.search);
  const storyId = urlParams.get('id');

  // Example dynamic content map
  const sampleStories = {
    "1": { title: "When the phone rang at 3 a.m.: a decade of rebuilding", author: "Priya Nandan", date: "Oct 12, 2026", content: "I used to think survival was a finish line — a place you crossed and then stood, breathless and safe..." },
    "2": { title: "Learning to name what you feel: a guide to emotional vocabulary", author: "Rohan Mehta", date: "Oct 8, 2026", content: "Trauma often leaves us with a shrinking vocabulary for our own inner life..." }
  };

  if (storyId && sampleStories[storyId]) {
    document.getElementById('story-title').innerText = sampleStories[storyId].title;
    document.getElementById('story-meta').innerText = `${sampleStories[storyId].author} · ${sampleStories[storyId].date}`;
    document.getElementById('story-content').innerText = sampleStories[storyId].content;
  }
</script>

</body>
</html>
